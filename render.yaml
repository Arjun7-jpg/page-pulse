services:
  - type: web
    name: page-pulse-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: node dist-server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://your-vercel-app-url.vercel.app,http://localhost:3000
